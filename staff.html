<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Family | طاقم الإدارة</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Cairo', sans-serif; background-color: #05050a; color: white; margin: 0; padding-top: 50px; padding-bottom: 50px; overflow-x: hidden; }
        /* الخلفية التفاعلية */
        .glow-bg { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: radial-gradient(circle at 15% 50%, rgba(220, 38, 38, 0.1), transparent 40%), radial-gradient(circle at 85% 30%, rgba(139, 92, 246, 0.1), transparent 40%), radial-gradient(circle at 50% 80%, rgba(234, 179, 8, 0.05), transparent 40%); z-index: -1; animation: pulseBg 10s infinite alternate; }
        @keyframes pulseBg { 0% { opacity: 0.7; transform: scale(1); } 100% { opacity: 1; transform: scale(1.1); } }
        .glass-card { background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.05); box-shadow: 0 4px 30px rgba(0, 0, 0, 0.5); transition: all 0.4s ease; }
        .glass-card:hover { transform: translateY(-10px) scale(1.02); }
        .gold-text { background: linear-gradient(to right, #bf953f, #fcf6ba, #b38728, #fbf5b7, #aa771c); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        h1, h2, h3, p, span { line-height: 1.8 !important; }
    </style>
</head>
<body class="flex flex-col items-center relative">
    <div class="glow-bg"></div>
    
    <div class="container mx-auto max-w-6xl px-4 z-10">
        
        <!-- زر العودة -->
        <div class="w-full flex justify-start mb-8">
            <a href="/family" class="bg-white/5 border border-white/10 hover:bg-white/10 text-white font-bold py-2 px-6 rounded-full flex items-center gap-2 transition-all">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>
                العودة للرئيسية
            </a>
        </div>

        <!-- العنوان -->
        <div class="text-center mb-16">
            <h1 class="text-5xl md:text-7xl font-black tracking-widest gold-text mb-4">طاقم الإدارة</h1>
            <p class="text-gray-400 text-lg">تعرف على نخبة مجتمع Family</p>
        </div>

        <!-- 1. Community Manager -->
        <div class="mb-16">
            <h2 class="text-2xl font-bold text-red-900 mb-6 border-r-4 border-red-900 pr-4">Community Manager</h2>
            <div class="flex justify-center">
                <div class="glass-card p-8 rounded-3xl flex flex-col items-center text-center w-full md:w-1/2 border-t-4 border-red-900 shadow-[0_0_30px_rgba(127,29,29,0.3)]">
                    <img src="https://ui-avatars.com/api/?name=Ammar&background=1a1a1a&color=7f1d1d&bold=true&size=150" class="w-32 h-32 rounded-full border-4 border-red-900 mb-4" alt="Ammar">
                    <h3 class="text-3xl font-bold text-white mb-2">Ammar</h3>
                    <p class="text-red-900 font-bold">Community Manager</p>
                </div>
            </div>
        </div>

        <!-- 2. Lead -->
        <div class="mb-16">
            <h2 class="text-2xl font-bold text-red-500 mb-6 border-r-4 border-red-500 pr-4">Lead</h2>
            <div class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-5 gap-6">
                <!-- الشخصيات -->
                <div class="glass-card p-6 rounded-2xl flex flex-col items-center text-center border-t-4 border-red-500"><img src="https://ui-avatars.com/api/?name=IDRIS&background=1a1a1a&color=ef4444&bold=true&size=150" class="w-24 h-24 rounded-full border-2 border-red-500 mb-3"><h3 class="text-xl font-bold text-white">!IDRIS</h3></div>
                <div class="glass-card p-6 rounded-2xl flex flex-col items-center text-center border-t-4 border-red-500"><img src="https://ui-avatars.com/api/?name=BEN+MISSO&background=1a1a1a&color=ef4444&bold=true&size=150" class="w-24 h-24 rounded-full border-2 border-red-500 mb-3"><h3 class="text-xl font-bold text-white">BEN MISSO</h3></div>
                <div class="glass-card p-6 rounded-2xl flex flex-col items-center text-center border-t-4 border-red-500"><img src="https://ui-avatars.com/api/?name=Qx&background=1a1a1a&color=ef4444&bold=true&size=150" class="w-24 h-24 rounded-full border-2 border-red-500 mb-3"><h3 class="text-xl font-bold text-white">Qx</h3></div>
                <div class="glass-card p-6 rounded-2xl flex flex-col items-center text-center border-t-4 border-red-500"><img src="https://ui-avatars.com/api/?name=Riso&background=1a1a1a&color=ef4444&bold=true&size=150" class="w-24 h-24 rounded-full border-2 border-red-500 mb-3"><h3 class="text-xl font-bold text-white">Riso</h3></div>
                <div class="glass-card p-6 rounded-2xl flex flex-col items-center text-center border-t-4 border-red-500"><img src="https://ui-avatars.com/api/?name=Rumi&background=1a1a1a&color=ef4444&bold=true&size=150" class="w-24 h-24 rounded-full border-2 border-red-500 mb-3"><h3 class="text-xl font-bold text-white">Rumi</h3></div>
            </div>
        </div>

        <!-- 3. Administrator -->
        <div class="mb-16">
            <h2 class="text-2xl font-bold text-yellow-500 mb-6 border-r-4 border-yellow-500 pr-4">Administrator</h2>
            <div class="grid grid-cols-2 md:grid-cols-2 lg:grid-cols-4 gap-6">
                <div class="glass-card p-6 rounded-2xl flex flex-col items-center text-center border-t-4 border-yellow-500"><img src="https://ui-avatars.com/api/?name=Goodman&background=1a1a1a&color=eab308&bold=true&size=150" class="w-24 h-24 rounded-full border-2 border-yellow-500 mb-3"><h3 class="text-xl font-bold text-white">Goodman</h3></div>
                <div class="glass-card p-6 rounded-2xl flex flex-col items-center text-center border-t-4 border-yellow-500"><img src="https://ui-avatars.com/api/?name=Nashmi&background=1a1a1a&color=eab308&bold=true&size=150" class="w-24 h-24 rounded-full border-2 border-yellow-500 mb-3"><h3 class="text-xl font-bold text-white">Nashmi</h3></div>
            </div>
        </div>

        <!-- 4. Staff -->
        <div class="mb-16">
            <h2 class="text-2xl font-bold text-purple-500 mb-6 border-r-4 border-purple-500 pr-4">Staff</h2>
            <div class="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-4 gap-6">
                <div class="glass-card p-6 rounded-2xl flex flex-col items-center text-center border-t-4 border-purple-500"><img src="https://ui-avatars.com/api/?name=Abdo&background=1a1a1a&color=a855f7&bold=true&size=150" class="w-24 h-24 rounded-full border-2 border-purple-500 mb-3"><h3 class="text-lg font-bold text-white">Staff Abdo</h3></div>
                <div class="glass-card p-6 rounded-2xl flex flex-col items-center text-center border-t-4 border-purple-500"><img src="https://ui-avatars.com/api/?name=ABDO&background=1a1a1a&color=a855f7&bold=true&size=150" class="w-24 h-24 rounded-full border-2 border-purple-500 mb-3"><h3 class="text-lg font-bold text-white">Staff ABDO 💧</h3></div>
                <div class="glass-card p-6 rounded-2xl flex flex-col items-center text-center border-t-4 border-purple-500"><img src="https://ui-avatars.com/api/?name=Abdulrahman&background=1a1a1a&color=a855f7&bold=true&size=150" class="w-24 h-24 rounded-full border-2 border-purple-500 mb-3"><h3 class="text-lg font-bold text-white">Staff Abdulrahman</h3></div>
                <div class="glass-card p-6 rounded-2xl flex flex-col items-center text-center border-t-4 border-purple-500"><img src="https://ui-avatars.com/api/?name=Khalil&background=1a1a1a&color=a855f7&bold=true&size=150" class="w-24 h-24 rounded-full border-2 border-purple-500 mb-3"><h3 class="text-lg font-bold text-white">Staff khalil 💧</h3></div>
                <div class="glass-card p-6 rounded-2xl flex flex-col items-center text-center border-t-4 border-purple-500"><img src="https://ui-avatars.com/api/?name=Saidi&background=1a1a1a&color=a855f7&bold=true&size=150" class="w-24 h-24 rounded-full border-2 border-purple-500 mb-3"><h3 class="text-lg font-bold text-white">Staff Saidi</h3></div>
                <div class="glass-card p-6 rounded-2xl flex flex-col items-center text-center border-t-4 border-purple-500"><img src="https://ui-avatars.com/api/?name=SALIH&background=1a1a1a&color=a855f7&bold=true&size=150" class="w-24 h-24 rounded-full border-2 border-purple-500 mb-3"><h3 class="text-lg font-bold text-white">Staff SALIH</h3></div>
                <div class="glass-card p-6 rounded-2xl flex flex-col items-center text-center border-t-4 border-purple-500"><img src="https://ui-avatars.com/api/?name=shs&background=1a1a1a&color=a855f7&bold=true&size=150" class="w-24 h-24 rounded-full border-2 border-purple-500 mb-3"><h3 class="text-lg font-bold text-white">Staff shs</h3></div>
                <div class="glass-card p-6 rounded-2xl flex flex-col items-center text-center border-t-4 border-purple-500"><img src="https://ui-avatars.com/api/?name=Yazan&background=1a1a1a&color=a855f7&bold=true&size=150" class="w-24 h-24 rounded-full border-2 border-purple-500 mb-3"><h3 class="text-lg font-bold text-white">Staff Yazan 💧</h3></div>
            </div>
        </div>

    </div>
</body>
</html>
